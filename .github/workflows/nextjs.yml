name: Deploy SammyRemi Technologies to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "sammyremi-technologies/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Next.js Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sammyremi-technologies/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: sammyremi-technologies

      - name: Build Static Website
        run: npm run build
        working-directory: sammyremi-technologies

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify Static Export
        run: |
          if [ ! -d "sammyremi-technologies/out" ]; then
            echo "Error: Next.js static export directory was not generated."
            exit 1
          fi

          if [ ! -f "sammyremi-technologies/out/index.html" ]; then
            echo "Error: out/index.html was not generated."
            exit 1
          fi

          if [ ! -f "sammyremi-technologies/out/CNAME" ]; then
            echo "Error: out/CNAME is missing. Check public/CNAME."
            exit 1
          fi

          echo "Static export verified successfully."
          ls -la sammyremi-technologies/out

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sammyremi-technologies/out

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy SammyRemi Technologies to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "data/**"
      - "public/**"
      - ".github/workflows/nextjs.yml"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "eslint.config.mjs"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Next.js Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Website
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /sammyremi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify Static Export
        run: |
          test -d out || (echo "Missing out directory" && exit 1)
          test -f out/index.html || (echo "Missing out/index.html" && exit 1)
          test -f out/CNAME || (echo "Missing out/CNAME" && exit 1)

          touch out/.nojekyll

          echo "Checking exported assets..."
          find out/_next -maxdepth 3 -type f | head -30
          echo "Static export verified."

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4